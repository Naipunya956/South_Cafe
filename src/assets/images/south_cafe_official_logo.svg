<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Circular Cream Background -->
  <circle cx="200" cy="200" r="190" fill="#FAF7EE" />
  
  <!-- Yellow / Golden-Orange Outer Ring -->
  <circle cx="200" cy="200" r="182" fill="none" stroke="#F5A623" stroke-width="14" />
  <circle cx="200" cy="200" r="172" fill="none" stroke="#E29215" stroke-width="1.5" />
  <circle cx="200" cy="200" r="191" fill="none" stroke="#E29215" stroke-width="1.5" />

  <!-- Official Kolam Knot Symbol at the Top -->
  <g transform="translate(200, 102) scale(0.68)">
    <!-- Central diamond and intersecting curves -->
    <path d="M0 -42 C -8 -22 -22 -8 -42 0 C -22 8 -8 22 0 42 C 8 22 22 8 42 0 C 22 -8 8 -22 0 -42 Z" 
          fill="none" stroke="#B85324" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Outer looped petals -->
    <path d="M -18 -18 C -32 -32 -32 -44 -20 -44 C -8 -44 -4 -28 0 -18 C 4 -28 8 -44 20 -44 C 32 -44 32 -32 18 -18 C 32 -4 44 -8 44 0 C 44 8 32 4 18 18 C 32 32 32 44 20 44 C 8 44 4 28 0 18 C -4 28 -8 44 -20 44 C -32 44 -32 32 -18 18 C -32 4 -44 8 -44 0 C -44 -8 -32 -4 -18 -18 Z" 
          fill="none" stroke="#B85324" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Dots matrix -->
    <circle cx="0" cy="0" r="4.5" fill="#B85324" />
    <circle cx="0" cy="-20" r="3.5" fill="#B85324" />
    <circle cx="0" cy="20" r="3.5" fill="#B85324" />
    <circle cx="-20" cy="0" r="3.5" fill="#B85324" />
    <circle cx="20" cy="0" r="3.5" fill="#B85324" />
    <circle cx="-16" cy="-16" r="3" fill="#B85324" />
    <circle cx="16" cy="-16" r="3" fill="#B85324" />
    <circle cx="-16" cy="16" r="3" fill="#B85324" />
    <circle cx="16" cy="16" r="3" fill="#B85324" />
  </g>

  <!-- Brand Typography: SOUTH CAFE in bold, tracked uppercase -->
  <text x="200" y="196" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" 
        font-weight="800" 
        font-size="34" 
        letter-spacing="3.5" 
        fill="#1C1815">
    SOUTH CAFE
  </text>

  <!-- Typography: The in subtle elegant serif -->
  <text x="200" y="232" 
        text-anchor="middle" 
        font-family="'Cormorant Garamond', Georgia, serif" 
        font-style="italic" 
        font-weight="400" 
        font-size="22" 
        fill="#645D55">
    The
  </text>

  <!-- Typography: Paakashala in warm terracotta serif -->
  <text x="200" y="278" 
        text-anchor="middle" 
        font-family="'Cormorant Garamond', Georgia, serif" 
        font-weight="600" 
        font-size="44" 
        letter-spacing="1" 
        fill="#C25E34">
    Paakashala
  </text>
</svg>
